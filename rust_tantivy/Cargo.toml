[package]
name = "rust_tantivy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tantivy = "0.25.0"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
[build-dependencies]
cbindgen = "0.29.2"

# iOS 타겟 설정
[profile.release]
opt-level = 3
lto = true

# zstd-sys를 위한 C 컴파일러 플래그 설정
[target.aarch64-apple-ios.dependencies]

[package.metadata.ios]
deployment-target = "12.0"